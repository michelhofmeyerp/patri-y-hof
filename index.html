        h_b_4: [{ month: "Sep", weight: 17.5 }, { month: "Oct", weight: 20 }, { month: "Nov", weight: 22.5 }],
        h_b_5: [{ month: "Sep", weight: 12 }, { month: "Oct", weight: 14 }, { month: "Nov", weight: 16 }],
        h_l_1: [{ month: "Sep", weight: 60 }, { month: "Oct", weight: 70 }, { month: "Nov", weight: 75 }],
        h_l_2: [{ month: "Sep", weight: 45 }, { month: "Oct", weight: 50 }, { month: "Nov", weight: 55 }],
        h_l_3: [{ month: "Sep", weight: 80 }, { month: "Oct", weight: 95 }, { month: "Nov", weight: 110 }],
        h_l_4: [{ month: "Sep", weight: 50 }, { month: "Oct", weight: 60 }, { month: "Nov", weight: 65 }]
      }
    };

    const MONTHS = ["Ene", "Feb", "Mar", "Abr", "May", "Jun", "Jul", "Ago", "Sep", "Oct", "Nov", "Dic"];

    // --- GRÁFICA SVG LIMPIA ---
    const ProgressChart = ({ seriesList, unit = "kg" }) => {
      const allPoints = seriesList.flatMap(s => s.data);
      if (allPoints.length === 0) {
        return <div className="h-32 flex items-center justify-center text-xs text-zinc-500">Sin datos registrados aún</div>;
      }
      const maxVal = Math.max(...allPoints.map(d => d.weight), 10) * 1.15;
      const minVal = Math.max(0, Math.min(...allPoints.map(d => d.weight)) * 0.75);
      const range = Math.max(maxVal - minVal, 5);

      const width = 300;
      const height = 115;
      const padX = 24;
      const padY = 18;

      const labels = Array.from(new Set(allPoints.map(d => d.month)));

      return (
        <svg viewBox={`0 0 ${width} ${height}`} className="w-full h-32 overflow-visible">
          {[0, 0.5, 1].map((t, i) => {
            const y = padY + t * (height - padY * 2);
            return <line key={i} x1={padX} y1={y} x2={width - padX} y2={y} stroke="#27272a" strokeDasharray="3 3" strokeWidth="1" />;
          })}

          {seriesList.map((serie, sIdx) => {
            if (!serie.data || serie.data.length === 0) return null;
            const coords = serie.data.map((pt, idx) => {
              const xIndex = labels.indexOf(pt.month);
              const x = labels.length === 1
                ? width / 2
                : padX + (xIndex / (labels.length - 1)) * (width - padX * 2);
              const y = height - padY - ((pt.weight - minVal) / range) * (height - padY * 2);
              return { x, y, weight: pt.weight, month: pt.month };
            });

            const poly = coords.map(c => `${c.x},${c.y}`).join(" ");
            return (
              <g key={sIdx}>
                {coords.length > 1 && (
                  <polyline fill="none" stroke={serie.color} strokeWidth="2.8" strokeLinecap="round" strokeLinejoin="round" points={poly} />
                )}
                {coords.map((c, idx) => (
                  <g key={idx}>
                    <circle cx={c.x} cy={c.y} r="4" fill="#09090b" stroke={serie.color} strokeWidth="2.5" />
                    <text x={c.x} y={c.y - 8} textAnchor="middle" fill={serie.color} fontSize="9.5" fontWeight="800">
                      {c.weight}{unit}
                    </text>
                  </g>
                ))}
              </g>
            );
          })}

          {labels.map((lbl, i) => {
            const x = labels.length === 1 ? width / 2 : padX + (i / (labels.length - 1)) * (width - padX * 2);
            return (
              <text key={lbl} x={x} y={height - 2} textAnchor="middle" fill="#a1a1aa" fontSize="9.5" fontWeight="600">
                {lbl}
              </text>
            );
          })}
        </svg>
      );
    };

    function App() {
      const [activeTab, setActiveTab] = useState("inicio");
      const [users, setUsers] = useState(() => {
        const saved = localStorage.getItem("ph_users_v2");
        return saved ? JSON.parse(saved) : ["Patri", "Hof"];
      });
      const [currentUser, setCurrentUser] = useState(() => localStorage.getItem("ph_current_user_v2") || "Hof");
      const [logs, setLogs] = useState(() => {
        const saved = localStorage.getItem("ph_logs_v2");
        return saved ? JSON.parse(saved) : INITIAL_LOGS;
      });

      const [memeIdx, setMemeIdx] = useState(() => new Date().getDate() % GYM_MEMES.length);
      const [newAccountName, setNewAccountName] = useState("");
      const [hoyOwner, setHoyOwner] = useState("Patri");
      const [selectedDayIdx, setSelectedDayIdx] = useState(0);
      const [weightInputs, setWeightInputs] = useState({});
      const [savedToast, setSavedToast] = useState("");
      const [progressFilter, setProgressFilter] = useState("all");
      const [groupCodeInput, setGroupCodeInput] = useState("");
      const [copiedCode, setCopiedCode] = useState(false);

      const GROUP_CODE = "PH-GYM-2026";

      useEffect(() => { localStorage.setItem("ph_users_v2", JSON.stringify(users)); }, [users]);
      useEffect(() => { localStorage.setItem("ph_current_user_v2", currentUser); }, [currentUser]);
      useEffect(() => { localStorage.setItem("ph_logs_v2", JSON.stringify(logs)); }, [logs]);

      const currentMonth = MONTHS[new Date().getMonth()];

      const handleCreateAccount = (e) => {
        e.preventDefault();
        const clean = newAccountName.trim();
        if (!clean) return;
        if (!users.includes(clean)) {
          setUsers([...users, clean]);
          setLogs(prev => ({ ...prev, [clean]: {} }));
        }
        setCurrentUser(clean);
        setNewAccountName("");
      };

      const handleSaveWeight = (exerciseId) => {
        const raw = weightInputs[exerciseId];
        const val = parseFloat(raw);
        if (isNaN(val) || val <= 0) return;

        setLogs(prev => {
          const userLogs = prev[currentUser] || {};
          const exHistory = [...(userLogs[exerciseId] || [])];
          const existingMonthIdx = exHistory.findIndex(item => item.month === currentMonth);
          if (existingMonthIdx >= 0) {
            exHistory[existingMonthIdx] = { month: currentMonth, weight: val };
          } else {
            exHistory.push({ month: currentMonth, weight: val });
          }
          return {
            ...prev,
            [currentUser]: {
              ...userLogs,
              [exerciseId]: exHistory
            }
          };
        });

        setWeightInputs(prev => ({ ...prev, [exerciseId]: "" }));
        setSavedToast(exerciseId);
        setTimeout(() => setSavedToast(""), 1800);
      };

      // Resumen de progresos para Inicio
      const summaryStats = useMemo(() => {
        const userLogs = logs[currentUser] || {};
        let totalGain = 0;
        let maxLift = { name: "—", weight: 0, unit: "kg" };
        const improvements = [];

        ALL_EXERCISES.forEach(ex => {
          const hist = userLogs[ex.id];
          if (hist && hist.length > 0) {
            const last = hist[hist.length - 1].weight;
            const first = hist[0].weight;
            const diff = +(last - first).toFixed(1);
            if (ex.unit === "kg") {
              totalGain += Math.max(0, diff);
              if (last > maxLift.weight) {
                maxLift = { name: ex.name, weight: last, unit: ex.unit };
              }
            }
            if (diff > 0) {
              improvements.push({ name: ex.name, diff, unit: ex.unit, current: last });
            }
          }
        });

        improvements.sort((a, b) => b.diff - a.diff);
        return { totalGain: +totalGain.toFixed(1), maxLift, topImprovements: improvements.slice(0, 3) };
      }, [logs, currentUser]);

      const activeRoutines = hoyOwner === "Patri" ? PATRI_ROUTINES : HOF_ROUTINES;
      const safeDayIdx = selectedDayIdx < activeRoutines.length ? selectedDayIdx : 0;
      const currentRoutineDay = activeRoutines[safeDayIdx];

      const filteredExercises = ALL_EXERCISES.filter(ex => {
        if (progressFilter === "Patri") return ex.owner === "Patri";
        if (progressFilter === "Hof") return ex.owner === "Hof";
        return true;
      });

      const userColors = ["#FA8072", "#38bdf8", "#a78bfa", "#34d399", "#fbbf24"];

      return (
        <div className="min-h-screen bg-zinc-950 text-zinc-100 relative selection:bg-[#FA8072] selection:text-zinc-950">
          {/* Fondo de gimnasio sutil en todas las pantallas */}
          <div
            className="fixed inset-0 bg-cover bg-center opacity-15 pointer-events-none"
            style={{ backgroundImage: "url('https://images.unsplash.com/photo-1534438327276-14e5300c3a48?auto=format&fit=crop&w=1400&q=80')" }}
          />
          <div className="fixed inset-0 bg-gradient-to-b from-zinc-950/80 via-zinc-950/90 to-zinc-950 pointer-events-none" />

          <div className="relative z-10 max-w-md mx-auto min-h-screen flex flex-col">
            {/* CABECERA FIJA CON NOMBRE EN ROSA SALMÓN */}
            <header className="sticky top-0 z-30 bg-zinc-950/90 backdrop-blur-md border-b border-zinc-800/80 pt-3">
              <div className="px-4 pb-2 flex items-center justify-between">
                <span className="text-[11px] font-bold uppercase tracking-widest text-zinc-400">
                  Perfil: <strong className="text-[#FA8072]">{currentUser}</strong>
                </span>
                <h1 className="font-banner text-3xl sm:text-4xl tracking-wider text-[#FA8072] drop-shadow-[0_2px_10px_rgba(250,128,114,0.35)]">
                  PATRI &amp; HOF
                </h1>
                <span className="text-[11px] font-semibold text-zinc-400 bg-zinc-900 border border-zinc-800 px-2 py-0.5 rounded-full">
                  {currentMonth}
                </span>
              </div>

              {/* BARRA DE NAVEGACIÓN SUPERIOR */}
              <nav className="grid grid-cols-4 border-t border-zinc-900">
                {[
                  { id: "inicio", label: "Inicio", icon: "home" },
                  { id: "hoy", label: "Hoy", icon: "checkSquare" },
                  { id: "progreso", label: "Progreso", icon: "trendingUp" },
                  { id: "grupo", label: "Grupo", icon: "users" }
                ].map(tab => {
                  const active = activeTab === tab.id;
                  return (
                    <button
                      key={tab.id}
                      onClick={() => setActiveTab(tab.id)}
                      className={`flex flex-col items-center justify-center py-2.5 gap-1 border-b-2 transition-all ${
                        active
                          ? "border-[#FA8072] text-[#FA8072] bg-[#FA8072]/5"
                          : "border-transparent text-zinc-400 hover:text-zinc-200"
                      }`}
                    >
                      <Icon name={tab.icon} className="w-4 h-4" />
                      <span className="text-[11px] font-bold tracking-wide">{tab.label}</span>
                    </button>
                  );
                })}
              </nav>
            </header>

            {/* CONTENIDO DE LAS 4 PANTALLAS */}
            <main className="flex-1 p-4 pb-10 space-y-5">

              {/* ==================== 1. INICIO ==================== */}
              {activeTab === "inicio" && (
                <>
                  {/* Tarjeta Motivacional / Meme de Gym */}

                    <div className="absolute inset-0 bg-gradient-to-t from-zinc-950 via-zinc-950/40 to-transparent p-5 flex flex-col justify-between">
                      <div className="flex items-center justify-between">
                        <span className="px-2.5 py-1 rounded-full bg-[#FA8072] text-zinc-950 text-[10px] font-black uppercase tracking-wider">
                          {GYM_MEMES[memeIdx].tag}
                        </span>
                        <div className="flex gap-1.5">
                          <button
                            onClick={() => setMemeIdx((memeIdx - 1 + GYM_MEMES.length) % GYM_MEMES.length)}
                            className="p-1.5 rounded-full bg-zinc-950/70 border border-zinc-700 text-white hover:border-[#FA8072]"
                          >
                            <Icon name="chevronLeft" className="w-4 h-4" />
                          </button>
                          <button
                            onClick={() => setMemeIdx((memeIdx + 1) % GYM_MEMES.length)}
                            className="p-1.5 rounded-full bg-zinc-950/70 border border-zinc-700 text-white hover:border-[#FA8072]"

                            <Icon name="chevronRight" className="w-4 h-4" />
                          </button>
                        </div>
                      </div>

                      <div>
                        <p className="font-banner text-2xl sm:text-3xl leading-tight text-white drop-shadow">
                          "{GYM_MEMES[memeIdx].quote}"
                        </p>
                        <p className="text-xs text-[#FA8072] font-semibold mt-1.5">
                          {GYM_MEMES[memeIdx].sub}
                        </p>
                      </div>
                    </div>
                  </div>

                  {/* Selector y Creación de Cuenta */}
                  <section className="bg-zinc-900/80 backdrop-blur border border-zinc-800 rounded-2xl p-4 space-y-3">
                    <div className="flex items-center justify-between">
                      <h2 className="text-sm font-extrabold uppercase tracking-wider text-zinc-200 flex items-center gap-2">
                        <Icon name="userPlus" className="w-4 h-4 text-[#FA8072]" />
                        Cuentas de la App
                      </h2>
                      <span className="text-[11px] text-zinc-400">Toca para cambiar</span>
                    </div>

                    <div className="flex flex-wrap gap-2">
                      {users.map(u => {
                        const isSelected = u === currentUser;
                        return (
                          <button
                            key={u}
                            onClick={() => {
                              setCurrentUser(u);
                              if (u === "Patri" || u === "Hof") setHoyOwner(u);
                            }}
                            className={`px-3.5 py-2 rounded-xl text-xs font-extrabold transition-all border ${
                              isSelected
                                ? "bg-[#FA8072] text-zinc-950 border-[#FA8072] shadow-lg shadow-[#FA8072]/20"
                                : "bg-zinc-950 text-zinc-300 border-zinc-800 hover:border-zinc-600"
                            }`}
                          >
                            {u}
                          </button>
                        );
                      })}
                    </div>

                    <form onSubmit={handleCreateAccount} className="flex gap-2 pt-1">
                      <input
                        type="text"
                        placeholder="Crear cuenta (ej. Carlos, Ana...)"
                        value={newAccountName}
                        onChange={(e) => setNewAccountName(e.target.value)}
                        className="flex-1 bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2 text-xs text-white placeholder-zinc-500 focus:outline-none focus:border-[#FA8072]"
                      />
                      <button
                        type="submit"
                        className="px-4 py-2 rounded-xl bg-zinc-800 hover:bg-[#FA8072] hover:text-zinc-950 text-xs font-bold transition-colors"
                      >
                        Entrar
                      </button>
                    </form>
                  </section>

                  {/* Mini Resumen de Progresos */}
                  <section className="bg-zinc-900/80 backdrop-blur border border-zinc-800 rounded-2xl p-4 space-y-3">
                    <div className="flex items-center justify-between">
                      <h2 className="text-sm font-extrabold uppercase tracking-wider text-zinc-200 flex items-center gap-2">
                        <Icon name="trophy" className="w-4 h-4 text-[#FA8072]" />
                        Mini Resumen · {currentUser}
                      </h2>
                      <button
                        onClick={() => setActiveTab("progreso")}
                        className="text-[11px] font-bold text-[#FA8072] hover:underline"
                      >
                        Ver gráficas →
                      </button>
                    </div>

                    <div className="grid grid-cols-2 gap-2.5">
                      <div className="bg-zinc-950/90 border border-zinc-800/90 rounded-xl p-3">
                        <p className="text-[10px] uppercase font-bold text-zinc-400">Kilos ganados</p>
                        <p className="text-xl font-black text-[#FA8072] mt-0.5">+{summaryStats.totalGain} kg</p>
                      </div>
                      <div className="bg-zinc-950/90 border border-zinc-800/90 rounded-xl p-3">
                        <p className="text-[10px] uppercase font-bold text-zinc-400">Récord máximo</p>
                        <p className="text-xl font-black text-white mt-0.5">{summaryStats.maxLift.weight} kg</p>
                        <p className="text-[10px] text-zinc-400 truncate">{summaryStats.maxLift.name}</p>
                      </div>
                    </div>

                    {summaryStats.topImprovements.length > 0 && (
                      <div className="space-y-1.5 pt-1">
                        <p className="text-[11px] font-bold text-zinc-400">Mayores subidas:</p>
                        {summaryStats.topImprovements.map((item, i) => (
                          <div key={i} className="flex items-center justify-between text-xs bg-zinc-950/70 px-3 py-2 rounded-lg border border-zinc-800/60">
                            <span className="text-zinc-200 truncate pr-2">{item.name}</span>
                            <span className="font-extrabold text-emerald-400 shrink-0">+{item.diff} {item.unit}</span>
                          </div>
                        ))}
                      </div>
                    )}
                  </section>
                </>
              )}

              {/* ==================== 2. HOY ==================== */}
              {activeTab === "hoy" && (
                <>
                  {/* Selector Rutina de Patri vs Rutina de Hof */}
                  <div className="grid grid-cols-2 gap-2.5 bg-zinc-900/90 p-1.5 rounded-2xl border border-zinc-800">
                    <button
                      onClick={() => { setHoyOwner("Patri"); setSelectedDayIdx(0); }}
                      className={`py-2.5 rounded-xl text-xs font-black uppercase tracking-wider transition-all ${
                        hoyOwner === "Patri"
                          ? "bg-[#FA8072] text-zinc-950 shadow-md"
                          : "text-zinc-400 hover:text-white"
                      }`}
                    >
                      Ejercicios Patri
                    </button>
                    <button
                      onClick={() => { setHoyOwner("Hof"); setSelectedDayIdx(0); }}
                      className={`py-2.5 rounded-xl text-xs font-black uppercase tracking-wider transition-all ${
                        hoyOwner === "Hof"
                          ? "bg-[#FA8072] text-zinc-950 shadow-md"
                          : "text-zinc-400 hover:text-white"
                      }`}
                    >
                      Ejercicios Hof
                    </button>
                  </div>

                  {/* Selector de Días */}
                  <div className="flex gap-2 overflow-x-auto no-scrollbar pb-1">
                    {activeRoutines.map((r, idx) => (
                      <button
                        key={r.day}
                        onClick={() => setSelectedDayIdx(idx)}
                        className={`px-3.5 py-2 rounded-xl text-xs font-extrabold whitespace-nowrap border transition-all ${
                          safeDayIdx === idx
                            ? "bg-zinc-100 text-zinc-950 border-white"
                            : "bg-zinc-900/90 text-zinc-400 border-zinc-800 hover:border-zinc-600"
                        }`}
                      >
                        {r.day}
                      </button>
                    ))}
                  </div>

                  {/* Listado de Ejercicios del Día */}
                  <div className="space-y-3">
                    <div className="flex items-center justify-between px-1">
                      <h2 className="text-sm font-black uppercase tracking-wider text-[#FA8072]">
                        {currentRoutineDay.day} · {hoyOwner}
                      </h2>
                      <span className="text-[11px] text-zinc-400">
                        Apuntando como <strong className="text-white">{currentUser}</strong>
                      </span>
                    </div>

                    {currentRoutineDay.exercises.map((ex, index) => {
                      const userHist = (logs[currentUser] && logs[currentUser][ex.id]) || [];
                      const lastRecord = userHist.length > 0 ? userHist[userHist.length - 1] : null;
                      const isSaved = savedToast === ex.id;

                      return (
                        <div
                          key={ex.id}
                          className="bg-zinc-900/85 backdrop-blur border border-zinc-800 rounded-2xl p-3.5 flex gap-3.5 items-center shadow-lg"
                        >
                          <ExerciseVisual type={ex.visual} />

                          <div className="flex-1 min-w-0 space-y-1.5">
                            <div className="flex items-start justify-between gap-2">
                              <h3 className="text-sm font-extrabold text-white leading-snug">
                                <span className="text-[#FA8072] mr-1.5">{index + 1}.</span>
                                {ex.name}
                              </h3>
                            </div>

                            <div className="flex flex-wrap items-center gap-1.5 text-[11px]">
                              <span className="px-2 py-0.5 rounded-md bg-zinc-950 border border-zinc-800 text-zinc-300 font-semibold">
                                {ex.sets}
                              </span>
                              <span className="px-2 py-0.5 rounded-md bg-[#FA8072]/15 text-[#FA8072] font-bold">
                                {ex.muscle}
                              </span>
                            </div>

                            {/* Input rápido para apuntar peso de hoy */}
                            <div className="pt-1 flex items-center gap-2">
                              <input
                                type="number"
                                step="0.5"
                                placeholder={lastRecord ? `Último: ${lastRecord.weight} ${ex.unit}` : `Peso (${ex.unit})`}
                                value={weightInputs[ex.id] || ""}
                                onChange={(e) => setWeightInputs({ ...weightInputs, [ex.id]: e.target.value })}
                                className="w-28 bg-zinc-950 border border-zinc-700 rounded-lg px-2.5 py-1.5 text-xs text-white placeholder-zinc-500 focus:outline-none focus:border-[#FA8072]"
                              />
                              <button
                                onClick={() => handleSaveWeight(ex.id)}
                                className={`px-3 py-1.5 rounded-lg text-xs font-extrabold flex items-center gap-1 transition-all ${
                                  isSaved
                                    ? "bg-emerald-500 text-zinc-950"
                                    : "bg-[#FA8072] text-zinc-950 hover:brightness-110"
                                }`}
                              >
                                <Icon name={isSaved ? "check" : "save"} className="w-3.5 h-3.5" />
                                {isSaved ? "Guardado" : "Guardar"}
                              </button>
                            </div>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </>
              )}

              {/* ==================== 3. PROGRESO ==================== */}
              {activeTab === "progreso" && (
                <>
                  <div className="flex items-center justify-between">
                    <div>
                      <h2 className="text-base font-black uppercase tracking-wider text-white">
                        Progreso de {currentUser}
                      </h2>
                      <p className="text-xs text-zinc-400">Evolución mensual por ejercicio</p>
                    </div>
                    <div className="flex gap-1 bg-zinc-900 p-1 rounded-xl border border-zinc-800">
                      {[
                        { id: "all", label: "Todos" },
                        { id: "Patri", label: "Patri" },
                        { id: "Hof", label: "Hof" }
                      ].map(f => (
                        <button
                          key={f.id}
                          onClick={() => setProgressFilter(f.id)}
                          className={`px-2.5 py-1 rounded-lg text-[11px] font-bold transition-all ${
                            progressFilter === f.id ? "bg-[#FA8072] text-zinc-950" : "text-zinc-400"
                          }`}
                        >
                          {f.label}
                        </button>
                      ))}
                    </div>
                  </div>

                  <div className="space-y-3">
                    {filteredExercises.map(ex => {
                      const data = (logs[currentUser] && logs[currentUser][ex.id]) || [];
                      const lastVal = data.length > 0 ? data[data.length - 1].weight : 0;

                      return (
                        <div key={ex.id} className="bg-zinc-900/85 border border-zinc-800 rounded-2xl p-4 space-y-2">
                          <div className="flex items-start justify-between gap-2">
                            <div>
                              <span className="text-[10px] font-bold uppercase tracking-wider text-[#FA8072]">
                                {ex.owner} · {ex.dayLabel}
                              </span>
                              <h3 className="text-sm font-extrabold text-white">{ex.name}</h3>
                            </div>
                            <span className="px-2.5 py-1 rounded-lg bg-zinc-950 border border-zinc-800 text-xs font-black text-[#FA8072] shrink-0">
                              {lastVal > 0 ? `${lastVal} ${ex.unit}` : "Sin marca"}
                            </span>

                          <ProgressChart seriesList={[{ data, color: "#FA8072" }]} unit={ex.unit} />

                  </div>
                </>
              )}

              {/* ==================== 4. GRUPO ==================== */}
              {activeTab === "grupo" && (
                <>
                  {/* Código de Invitación del Grupo */}
                  <div className="bg-zinc-900/90 border border-zinc-800 rounded-2xl p-4 space-y-3">
                    <div className="flex items-center justify-between">
                      <div>
                        <h2 className="text-sm font-black uppercase tracking-wider text-white">
                          Código de Grupo
                        </h2>
                        <p className="text-xs text-zinc-400">Compártelo para comparar marcas juntos</p>
                      </div>
                      <button
                        onClick={() => {
                          navigator.clipboard?.writeText(GROUP_CODE);
                          setCopiedCode(true);
                          setTimeout(() => setCopiedCode(false), 2000);
                        }}
                        className="flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-[#FA8072] text-zinc-950 text-xs font-black"
                      >
                        <Icon name={copiedCode ? "check" : "copy"} className="w-3.5 h-3.5" />
                        {copiedCode ? "Copiado" : GROUP_CODE}
                      </button>
                    </div>

                    {/* Leyenda de miembros */}
                    <div className="flex flex-wrap items-center gap-3 pt-1 border-t border-zinc-800/80">
                      {users.map((u, idx) => (
                        <div key={u} className="flex items-center gap-1.5 text-xs font-bold text-zinc-200">
                          <span
                            className="w-3 h-3 rounded-full"
                            style={{ backgroundColor: userColors[idx % userColors.length] }}
                          />
                          {u}
                        </div>
                      ))}
                    </div>

                    <div className="flex gap-2">
                      <input
                        type="text"
                        placeholder="Introduce código de grupo..."
                        value={groupCodeInput}
                        onChange={(e) => setGroupCodeInput(e.target.value)}
                        className="flex-1 bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-1.5 text-xs text-white placeholder-zinc-500 focus:outline-none focus:border-[#FA8072]"
                      />
                      <button
                        onClick={() => {
                          if (groupCodeInput.trim()) {
                            alert(`Conectado al grupo ${groupCodeInput.toUpperCase()}`);
                            setGroupCodeInput("");
                          }
                        }}
                        className="px-3.5 py-1.5 rounded-xl bg-zinc-800 hover:bg-[#FA8072] hover:text-zinc-950 text-xs font-bold transition-colors"
                      >
                        Unirse
                      </button>
                    </div>
                  </div>

                  {/* Gráficas Comparativas de Todos los Ejercicios */}
                  <div className="space-y-3">
                    <h3 className="text-xs font-black uppercase tracking-wider text-zinc-400 px-1">
                      Comparativa de Progresos ({users.length} miembros)
                    </h3>

                    {ALL_EXERCISES.map(ex => {
                      const seriesList = users.map((u, idx) => ({
                        user: u,
                        data: (logs[u] && logs[u][ex.id]) || [],
                        color: userColors[idx % userColors.length]
                      }));

                      return (
                        <div key={ex.id} className="bg-zinc-900/85 border border-zinc-800 rounded-2xl p-4 space-y-2">
                          <div className="flex items-center justify-between gap-2">
                            <div>
                              <span className="text-[10px] font-bold uppercase text-zinc-400">
                                Rutina {ex.owner} · {ex.dayLabel}
                              </span>
                              <h4 className="text-sm font-extrabold text-white">{ex.name}</h4>
                            </div>
                          </div>

                          <ProgressChart seriesList={seriesList} unit={ex.unit} />
                        </div>
                      );
                    })}
                  </div>
                </>
              )}

            </main>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
